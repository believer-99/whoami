<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ashutosh Shukla – Systems Engineer, AI Developer & Builder. Explore my portfolio through an interactive terminal." />
  <meta name="keywords" content="Ashutosh Shukla, Portfolio, Systems Engineering, AI, Machine Learning, Search Engine, believer_99" />
  <meta name="author" content="Ashutosh Shukla" />
  <title>believer_99 | Terminal Portfolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Devicons (tech logos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║         MARIO LOADING SCREEN         ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="loading-screen">
    <canvas id="mario-canvas" width="512" height="200"></canvas>
    <div id="loading-info">
      <div id="loading-label">BOOTING PORTFOLIO<span id="loading-dots"></span></div>
      <div id="loading-bar-wrap">
        <div id="loading-bar"></div>
      </div>
      <div id="loading-sub">believer_99@portfolio ~ v1.0.0</div>
    </div>
  </div>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║            BACKGROUND LAYER          ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <canvas id="bg-canvas"></canvas>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║           TERMINAL WINDOW            ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="terminal-wrapper">
    <div id="terminal-window">

      <!-- Title bar -->
      <div id="titlebar">
        <div id="window-controls">
          <span class="wc-btn wc-close"    id="btn-close"    title="Close"></span>
          <span class="wc-btn wc-minimize" id="btn-minimize" title="Minimize"></span>
          <span class="wc-btn wc-maximize" id="btn-maximize" title="Maximize"></span>
        </div>
        <div id="titlebar-text">believer_99@portfolio: ~</div>
        <div class="wc-right-pad"></div>
      </div>

      <!-- Terminal body -->
      <div id="terminal-body">
        <div id="output" aria-live="polite" role="log" aria-label="Terminal output"></div>

        <!-- Active input row -->
        <div id="input-row">
          <span class="prompt" id="prompt-span">believer_99@portfolio:~$&nbsp;</span>
          <div id="input-wrap">
            <input
              type="text"
              id="cmd-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              aria-label="Command input"
            />
          </div>
        </div>
      </div>

    </div><!-- /#terminal-window -->
  </div><!-- /#terminal-wrapper -->

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║              SCRIPTS                 ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <script src="js/data.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
