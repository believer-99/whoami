<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ashutosh Shukla – Systems Engineer, AI Developer & Builder. Explore my portfolio through an interactive terminal." />
  <meta name="keywords" content="Ashutosh Shukla, Portfolio, Systems Engineering, AI, Machine Learning, Search Engine, believer_99" />
  <meta name="author" content="Ashutosh Shukla" />
  <title>believer_99 | Terminal Portfolio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Devicons (tech logos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║         PERCENTAGE LOADER SCREEN     ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="loading-screen">
    <div id="loading-container">
      <div class="vim-loader-logo">V I M</div>
      <div id="loading-label">BOOTING VIM PORTFOLIO</div>
      <div id="loading-progress-container">
        <div id="loading-bar-wrap">
          <div id="loading-bar"></div>
        </div>
        <div id="loading-percentage">0%</div>
      </div>
      <div id="loading-status">Initializing environment...</div>
      <div id="loading-console"></div>
    </div>
  </div>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║            BACKGROUND LAYER          ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <canvas id="bg-canvas"></canvas>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║           TERMINAL WINDOW            ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div id="terminal-wrapper">
    <div id="terminal-window">

      <!-- Vim Tabline -->
      <div id="titlebar">
        <div id="vim-tabs">
          <div class="vim-tab active" data-cmd="">term.sh</div>
          <div class="vim-tab" data-cmd="spotify">spotify.vim</div>
        </div>
        <div id="titlebar-text">VIM</div>
      </div>

      <!-- Terminal body -->
      <div id="terminal-body">
        <div id="output" aria-live="polite" role="log" aria-label="Terminal output"></div>

        <!-- Active input row -->
        <div id="input-row">
          <span class="prompt" id="prompt-span">believer_99@portfolio:~$&nbsp;</span>
          <div id="input-wrap">
            <input
              type="text"
              id="cmd-input"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              aria-label="Command input"
            />
          </div>
        </div>
      </div>

      <!-- Vim Statusline -->
      <div id="vim-statusline">
        <div class="sl-left">
          <span class="sl-mode" id="status-mode">NORMAL</span>
          <span class="sl-section sl-user" id="status-user">believer_99</span>
          <span class="sl-section sl-file" id="status-file">~</span>
        </div>
        <div class="sl-right">
          <span class="sl-section sl-encoding">utf-8</span>
          <span class="sl-section sl-format">unix</span>
          <span class="sl-section sl-percentage" id="status-pct">All</span>
          <span class="sl-section sl-linecol" id="status-linecol"> 1:1</span>
        </div>
      </div>

    </div><!-- /#terminal-window -->
  </div><!-- /#terminal-wrapper -->

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║              SCRIPTS                 ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <script src="js/data.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
